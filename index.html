            </div>

<!-- Checkout Modal Container -->
<div class="checkout-modal-container">
    <div class="checkout-modal">
        <div id="close-checkout-btn" class="fas fa-times"></div>
        <h3><i class="fas fa-credit-card"></i> Order Checkout</h3>
        <form id="checkout-form" onsubmit="return false;">
            <div class="order-summary-box">
                <h4>Order Summary</h4>
                <div id="checkout-items-summary"></div>
                <div class="checkout-total">
                    <span>Total Amount:</span>
                    <strong id="checkout-total-amount">$0.00</strong>
                </div>
            </div>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" class="box" placeholder="John Doe" id="checkout-name" required>
            </div>

            <div class="input-group">
                <label>Email Address (For Instant Delivery)</label>
                <input type="email" class="box" placeholder="john@example.com" id="checkout-email" required>
            </div>

            <div class="input-group">
                <label>Select Payment Method</label>
                <select class="box" id="checkout-payment-method">
                    <option value="credit-card">Credit / Debit Card</option>
                    <option value="paypal">PayPal</option>
                    <option value="apple-pay">Apple Pay</option>
                    <option value="crypto">Cryptocurrency (USDT)</option>
                </select>
            </div>
